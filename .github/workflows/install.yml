name: Cross-platform installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run test:python
      - run: npm run install:app
      - uses: actions/upload-artifact@v4
        with:
          name: financial-agent-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
